const FE=(()=>{
const FL=(typeof FLAGS!=='undefined'&&FLAGS)||{},on=k=>FL[k]!==false;

const cmask=new Int8Array(128).fill(15);

 bd.fill(0);const t=fen.split(' ');let r=0,c=0;
 for(const ch of t[0]){if(ch==='/'){r++;c=0}else if(ch>='1'&&ch<='8')c+=+ch;else{const lc=ch.toLowerCase(),ty='pnbrqk'.indexOf(lc)+1,pc=ty|(ch===lc?8:0);bd[r*16+c]=pc;if(ty===6)kS[pc>>3]=r*16+c;c++}}

function att(sq,by){
 let t;
 if(by===0){t=sq+15;if(!(t&0x88)&&bd[t]===1)return true;t=sq+17;if(!(t&0x88)&&bd[t]===1)return true}
 else{t=sq-15;if(!(t&0x88)&&bd[t]===9)return true;t=sq-17;if(!(t&0x88)&&bd[t]===9)return true}

 }

}
function make(m){
 const f=m&127,t=(m>>7)&127,pr=(m>>14)&7,fl=m>>17,pc=bd[f];let cap=bd[t];
 uM[sp]=m;uCr[sp]=cr;uEp[sp]=ep;uHf[sp]=half;uH1[sp]=h1;uH2[sp]=h2;
 if(ep>=0){h1^=ze1[ep&7];h2^=ze2[ep&7]}
 h1^=zc1[cr];h2^=zc2[cr];h1^=zp1[pc*128+f];h2^=zp2[pc*128+f];bd[f]=0;
 if(fl===1){const cs=t+(side?-16:16);cap=bd[cs];h1^=zp1[cap*128+cs];h2^=zp2[cap*128+cs];bd[cs]=0}
 else if(cap){h1^=zp1[cap*128+t];h2^=zp2[cap*128+t]}

function analyzeOpeningPhase(chess){
 const parts=chess.fen().split(' ');
 const fullmove=parseInt(parts[5])||1;
 const board=chess.board();
 let mat={w:0,b:0},dev={w:0,b:0},cast={w:false,b:false};
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const p=board[r][c];if(!p)continue;
  if(p.type==='k'){if(p.color==='w'&&c!==4)cast.w=true;if(p.color==='b'&&c!==4)cast.b=true;continue}
  if(p.type==='p')continue;
  const v={n:3,b:3,r:5,q:9}[p.type]||0;mat[p.color]+=v;
  if(p.color==='w'&&r>=3)dev.w++;if(p.color==='b'&&r<=4)dev.b++;
 }
 let phase='opening';
 if(mat.w<=6&&mat.b<=6)phase='endgame';
 else if(fullmove>10&&(cast.w||cast.b)&&mat.w<15)phase='middlegame';
 else if(fullmove>12&&(dev.w+dev.b)>=6)phase='middlegame';
 return{phase,fullmove,mat,dev,cast};
}
function detectOpening(chess){
 const n=s=>s.replace(/[+#]/g,'');
 const hist=chess.history().map(n);
 const lines=[];
 for(const[name,mv]of Object.entries(OPEN))if(!name.startsWith('—')&&mv.length)lines.push([name,mv.map(n)]);
 for(const[name,k,seq]of ECO)lines.push([name,seq.map(n)]);
 let best=null;
 for(const[name,seq]of lines){
  let c=0;while(c<seq.length&&c<hist.length&&hist[c]===seq[c])c++;
  const deviated=c<hist.length&&c<seq.length&&hist[c]!==seq[c];
  const score=c+(deviated?0.5:0);
  if(!best||score>best.score)best={name,c,deviated,score};
 }
 const ph=analyzeOpeningPhase(chess);
 if(!best||best.c<2)return{name:'',deviated:false,devColor:null,phase:ph.phase,fullmove:ph.fullmove};
 return{name:best.name,deviated:best.deviated,devColor:best.deviated?(best.c%2===0?'w':'b'):null,phase:ph.phase,fullmove:ph.fullmove};
}

  }

  const j=await getJSON('https://lichess.org/api/cloud-eval?fen='+encodeURIComponent(fen)+'&multiPv=1',2500);
  const pv=j&&j.pvs&&j.pvs[0];
  if(pv&&pv.moves&&(j.depth||0)>=24){
   const mm=legalByUci(pv.moves.split(' ')[0]);

    let cp=pv.mate!==undefined?(pv.mate>0?1:-1)*(100000-Math.abs(pv.mate)*2):(pv.cp||0);
    if(g.turn()==='b')cp=-cp;
    return{move:mm,score:cp,base:cp,depth:j.depth,nodes:0,src:'облако Lichess'};
   }
  }
 }

function bookMove(){

 let pool=[];
 if(sel.length)pool=[sel];else if($('oa')&&$('oa').checked)pool=ECO.map(e=>e[2].split(' '));
 const legal=g.moves().map(n),nx=[];
 for(const L of pool)if(h.length<L.length&&h.every((x,i)=>n(x)===n(L[i]))){const m=L[h.length];if(legal.includes(n(m))&&!nx.some(y=>n(y)===n(m)))nx.push(m)}

}

function think(ms){

 try{
  const mv=[];let m;while((m=g.undo()))mv.push(m);
  const sfen=g.fen();
  for(let k=mv.length-1;k>=0;k--)g.move(mv[k]);
  const hs=mv.reverse().map(x=>[x.from,x.to,x.promotion||'']);
  if(!FE.setup(sfen,hs))FE.setup(g.fen(),[]);
  const all=g.moves({verbose:true});if(!all.length)return null;
  const ts=tactSettings(),hard=$('tmax')?+$('tmax').value:0;
  const r=(ts&&ts.mode!=='solid'&&all.length>1)?FE.pick(ms,60,{mode:ts.mode,ct:ts.ct},hard):FE.think(all.length===1?Math.min(ms,40):ms,60,all.length===1?0:hard);if(!r)return null;
  const mm=all.find(x=>x.from===r.from&&x.to===r.to&&(!x.promotion||x.promotion===(r.promo||'q')))||all[0];
  return{move:mm,score:r.score,base:r.base!==undefined?r.base:r.score,trap:r.trap,depth:r.depth,nodes:r.nodes};
 }catch(e){return thinkOld(ms)}

}

  profObserve(r.base);
  nextRate=r.trap!==undefined?'excellent':'best';g.move(r.move);profRemember(r.score);afterMove();
  if(pmode){hint={from:r.move.from,to:r.move.to};render()}

 });
}
